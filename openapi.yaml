openapi: 3.0.0
info:
  title: Ombala API
  version: 1.0.0
servers:
  - url: https://api.useombala.ao
tags:
  - name: Mensagens
  - name: Remetentes
  - name: Créditos
  - name: Grupos de Envio
  - name: Sub-Contas
  - name: OTP
    description: |
      Envio e verificação de códigos de uso único (OTP) por SMS, para validar
      números de telefone, logins ou transacções dos seus utilizadores.

      Fluxo: pedir o envio com **Enviar Código OTP**, receber o código que o
      utilizador introduz na sua aplicação e confirmá-lo com **Verificar
      Código OTP**. Com várias aplicações ou fluxos para os mesmos números,
      use o parâmetro `context` para que os códigos de um não cancelem os do
      outro. O Ombala gera o código, guarda-o de forma segura (nunca
      o devolve pela API) e controla a validade, o número de tentativas e os
      reenvios.
paths:
  /v1/messages:
    post:
      tags:
        - Mensagens
      summary: Enviar Mensagem
      description: |
        Permite enviar uma SMS para um ou mais números de telefone.

        A autenticação pode ser feita com o token da conta principal ou com o
        `auth_token` de uma sub-conta (ver secção **Sub-Contas**); nesse caso o
        crédito é debitado da sub-conta (e da conta principal) e a mensagem
        fica associada a ela.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - message
                - from
                - to
              properties:
                message:
                  type: string
                  description: Texto da mensagem
                  required: true
                from:
                  type: string
                  description: Remetente da mensagem, deve estar previamente criado e aprovado.
                  required: true
                to:
                  type: string
                  description: Lista de número(s) destinatário(s) da mensagem, separados por
                    vírgula. Em alternativa, pode ser o ID de um Grupo de Envio
                    (ver secção **Grupos de Envio**) já criado, para enviar a
                    todos os números desse grupo.
                  required: true
                schedule:
                  type: string
                  description: Data e hora para o envio da SMS, no formato yyyyMMddHHmmss, ideal
                    para agendar o envio de uma SMS, não é um parâmetro
                    obrigatório. Tem de ser uma data/hora futura.
                  format: date-time
                  required: false
                ttl:
                  type: integer
                  description: |
                    Tempo de vida da SMS em segundos, não é um parâmetro obrigatório.

                    Se a SMS ainda estiver pendente (isto é, ainda não foi aceite
                    pelo operador/SMSC) quando este prazo expirar, o envio é
                    cancelado automaticamente, o estado passa a expirado
                    (visível como `REFUSED` no `message_status`) e o crédito
                    gasto é devolvido à conta (e à sub-conta, se aplicável).

                    Se a mensagem tiver `schedule`, a contagem do `ttl` começa
                    a partir da data/hora agendada, não da data de criação do
                    pedido.

                    Tem de ser um número inteiro de segundos entre 60 (1
                    minuto) e 604800 (7 dias); estes limites são configuráveis
                    no servidor e podem variar.
                  minimum: 60
                  maximum: 604800
                  required: false
              example:
                message: Mensagem de teste.
                from: MINHALOJA
                to: "921939411"
                schedule: "20231015182000"
                ttl: 3600
      parameters:
        - name: Authorization
          in: header
          schema:
            type: string
            description: Token de autorização disponível no Portal Ombala
          example: Token a9eb6ea6-5777-4848-a9ed-8cbffc74a503
        - name: Content-Type
          in: header
          schema:
            type: string
            description: Formato do conteúdo do pedido, formato application/json,
              obrigatório.
          example: application/json
      responses:
        "201":
          description: Mensagem enviada/agendada com sucesso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        4XX:
          description: |
            Houve um problema no pedido. Haverá uma descrição clara da causa
            do erro, por exemplo:
            - `remetente inválido` / `remetente pendente de aprovação`
            - `destinatário não pode estar vazio` / `destinatário {numero} tem o formato inválido`
            - `sem créditos suficientes` / `subconta sem créditos suficientes`
            - `data de agendamento não está no formato yyyyMMddHHmmss` / `data de agendamento está no passado`
            - `ttl deve ser um número inteiro de segundos entre {min} e {max}`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    get:
      tags:
        - Mensagens
      summary: Listar Mensagens
      parameters:
        - name: Authorization
          in: header
          schema:
            type: string
            description: Token de autorização disponível no Portal Ombala
          example: Token a9eb6ea6-5777-4848-a9ed-8cbffc74a503
        - name: page
          in: query
          schema:
            type: integer
            description: As mensagens serão retornadas em diversas páginas, pode requisitar
              uma página especifica por esse parâmentro, ele não é obrigatório.
          example: "0"
      responses:
        "200":
          description: Pedido Realizado com sucesso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageList"
  /v1/messages/{message_id}:
    delete:
      tags:
        - Mensagens
      summary: Delete
      description: Apagar o registro de envio de uma SMS
      parameters:
        - name: Authorization
          in: header
          schema:
            type: string
            description: Token de autorização disponível no Portal Ombala
          example: Token a9eb6ea6-5777-4848-a9ed-8cbffc74a503
        - name: message_id
          in: path
          required: true
          schema:
            type: string
            description: ID da mensagem
          example: b9eb6ea6-5117-4848-a9ed-8cbffc74a991
      responses:
        "204":
          description: Pedido Realizado com sucesso
          content:
            application/json: {}
        "404":
          description: Mensagem inexistente (ou não pertence à conta autenticada)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/messages/recipients:
    get:
      tags:
        - Mensagens
      summary: Listar destinatários
      description: Listar todos os números que já foram alvo de uma SMS através da sua conta
      parameters:
        - name: Authorization
          in: header
          schema:
            type: string
            description: Token de autorização disponível no Portal Ombala
          example: Token a9eb6ea6-5777-4848-a9ed-8cbffc74a503
        - name: page
          in: query
          schema:
            type: integer
            description: As mensagens serão retornadas em diversas páginas, pode requisitar
              uma página especifica por esse parâmentro, ele não é obrigatório.
          example: "1"
      responses:
        "200":
          description: Pedido Realizado com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  recipients:
                    type: array
                    items:
                      type: object
                      properties:
                        phone_number:
                          type: string
                          example: "921939455"
                  pagination:
                    $ref: "#/components/schemas/Pagination"
  /v1/messages/date:
    get:
      tags:
        - Mensagens
      summary: Listar Mensagens Intervalo de datas
      description: Listar todas as mensagens envidas dentro de um intervalo de datas
      parameters:
        - name: Authorization
          in: header
          schema:
            type: string
            description: Token de autorização disponível no Portal Ombala
          example: Token a9eb6ea6-5777-4848-a9ed-8cbffc74a503
        - name: start
          in: query
          description: Data de início da consulta, no formato YYYYMMDD
          required: true
          schema:
            type: integer
          example: "20231011"
        - name: end
          in: query
          description: Data de fim da consulta, no formato YYYYMMDD
          required: true
          schema:
            type: integer
          example: "20231020"
        - name: page
          in: query
          schema:
            type: integer
            description: As mensagens serão retornadas em diversas páginas, pode requisitar
              uma página especifica por esse parâmentro, ele não é obrigatório.
          example: "1"
      responses:
        "200":
          description: Pedido Realizado com sucesso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageList"
  /v1/messages/recipient:
    get:
      tags:
        - Mensagens
      summary: Listas de mensagens de um número/destinatário
      parameters:
        - name: Authorization
          in: header
          schema:
            type: string
            description: Token de autorização disponível no Portal Ombala
          example: Token a9eb6ea6-5777-4848-a9ed-8cbffc74a503
        - name: phone_number
          in: query
          schema:
            type: integer
          example: "921939455"
        - name: page
          in: query
          schema:
            type: integer
            description: Os resultados serão retornadas em diversas páginas, pode requisitar
              uma página especifica por esse parâmentro, ele não é obrigatório.
          example: "0"
      responses:
        "200":
          description: Pedido Realizado com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  messages:
                    type: array
                    items:
                      type: object
                      properties:
                        message_id:
                          type: string
                          description: ID do registo do destinatário (receiver) desta SMS
                        parent_id:
                          type: string
                          description: ID da mensagem
                        content:
                          type: string
                        message_status:
                          $ref: "#/components/schemas/MessageStatus"
                        created_at:
                          type: string
                          format: date-time
                  pagination:
                    $ref: "#/components/schemas/Pagination"
  /v1/messages/one:
    get:
      tags:
        - Mensagens
      summary: Mostrar mensagem ou destinatário por ID
      description: |
        Consulta um único registo. Consoante o parâmetro usado, devolve
        coisas diferentes — **usar apenas um dos dois de cada vez**:
        - `id` → devolve a mensagem completa (com todos os destinatários).
        - `message_id` → devolve o estado de um único destinatário
          (equivalente a um item de `recipients` dentro da mensagem).

        Nota: apesar do nome, `message_id` aqui identifica o registo do
        destinatário (receiver), não a mensagem — para a mensagem completa
        deve usar-se o parâmetro `id`.
      parameters:
        - name: Authorization
          in: header
          schema:
            type: string
            description: Token de autorização disponível no Portal Ombala
          example: Token a9eb6ea6-5777-4848-a9ed-8cbffc74a503
        - name: id
          in: query
          description: ID da Mensagem. Devolve a mensagem completa.
          schema:
            type: string
          example: 545b6ca5-a481-4abe-b3b9-ce1e8a4b3629
        - name: message_id
          in: query
          description: ID do destinatário (receiver) de uma mensagem. Devolve apenas
            esse destinatário.
          schema:
            type: string
          example: 545b6ca5-a481-4abe-b3b9-ce1e8a4b3629
      responses:
        "200":
          description: Pedido Realizado com sucesso
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/Message"
                  - $ref: "#/components/schemas/Receiver"
        "404":
          description: Mensagem/destinatário inexistente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/senders/:
    post:
      tags:
        - Remetentes
      summary: Criar Remetente
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: Nome do remente da SMS. Máximo de 11 caracteres e apenas
                    caracteres suportados pelo alfabeto GSM (não pode conter
                    emojis ou outros caracteres que obriguem a codificação
                    UTF-16).
                  maxLength: 11
                  required: true
              example:
                name: LOJAHEBER
      parameters:
        - name: Authorization
          in: header
          schema:
            type: string
            description: Token de autorização disponível no Portal Ombala
          example: Token a9eb6ea6-5777-4848-a9ed-8cbffc74a503
        - name: Content-Type
          in: header
          schema:
            type: string
            description: Formato do conteúdo do pedido, formato application/json,
              obrigatório.
          example: application/json
      responses:
        "201":
          description: Pedido Realizado com sucesso
          content:
            application/json: {}
        4XX:
          description: |
            Houve um problema no pedido, por exemplo:
            - `remetente já cadastrado`
            - `remetente não pode conter caracteres que não sejam GSM`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/senders:
    get:
      tags:
        - Remetentes
      summary: Listar Remetentes
      parameters:
        - name: Authorization
          in: header
          schema:
            type: string
            description: Token de autorização disponível no Portal Ombala
          example: Token a9eb6ea6-5777-4848-a9ed-8cbffc74a503
      responses:
        "200":
          description: Pedido Realizado com sucesso
          content:
            application/json: {}
  /v1/senders/approved:
    get:
      tags:
        - Remetentes
      summary: Listar Remetentes Aprovados
      parameters:
        - name: Authorization
          in: header
          schema:
            type: string
            description: Token de autorização disponível no Portal Ombala
          example: Token a9eb6ea6-5777-4848-a9ed-8cbffc74a503
      responses:
        "200":
          description: Pedido Realizado com sucesso
          content:
            application/json: {}
  /v1/senders/pending:
    get:
      tags:
        - Remetentes
      summary: Listar Remetentes Pendentes de Aprovação
      parameters:
        - name: Authorization
          in: header
          schema:
            type: string
            description: Token de autorização disponível no Portal Ombala
          example: Token a9eb6ea6-5777-4848-a9ed-8cbffc74a503
      responses:
        "200":
          description: Pedido Realizado com sucesso
          content:
            application/json: {}
  /v1/senders/{sender_id}:
    delete:
      tags:
        - Remetentes
      summary: Delete
      parameters:
        - name: Authorization
          in: header
          schema:
            type: string
            description: Token de autorização disponível no Portal Ombala
          example: Token a9eb6ea6-5777-4848-a9ed-8cbffc74a503
        - name: sender_id
          in: path
          required: true
          schema:
            type: string
            description: ID do Remetente
      responses:
        "204":
          description: Pedido Realizado com sucesso
          content:
            application/json: {}
  /v1/credits:
    get:
      tags:
        - Créditos
      summary: Mostrar Saldo/Créditos de SMS
      description: |
        Mostra o saldo de créditos de SMS disponível. Este saldo é ajustado
        automaticamente (crédito devolvido) sempre que uma SMS não chega a
        ser faturável, nomeadamente:
        - O relatório de entrega (DLR) devolvido pelo operador tem um estado
          não faturável (por exemplo `UNDELIV`, `EXPIRED`, `REJECTD`,
          `DELETED` ou `UNKNOWN`).
        - A SMS expira por `ttl` antes de ser aceite pelo operador (ver
          parâmetro `ttl` em **Enviar Mensagem**).

        Contas `postpaid` não são afetadas por este saldo/reembolso.
      parameters:
        - name: Authorization
          in: header
          schema:
            type: string
            description: Token de autorização disponível no Portal Ombala
          example: Token a9eb6ea6-5777-4848-a9ed-8cbffc74a503
      responses:
        "200":
          description: Pedido Realizado com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  available_sms:
                    type: integer
                    description: Créditos de SMS disponíveis
                  postpaid:
                    type: boolean
                    description: Indica se a conta é pós-paga (não debita créditos nem é
                      afetada por reembolsos automáticos)
  /v1/recharges:
    get:
      tags:
        - Créditos
      summary: Mostar Histórico de Carregamentos
      parameters:
        - name: Authorization
          in: header
          schema:
            type: string
            description: Token de autorização disponível no Portal Ombala
          example: Token a9eb6ea6-5777-4848-a9ed-8cbffc74a503
      responses:
        "200":
          description: Pedido Realizado com sucesso
          content:
            application/json: {}
  /v1/sending_groups:
    post:
      tags:
        - Grupos de Envio
      summary: Criar Grupo de Envio
      description: Cria um grupo de números para posteriormente serem usados como
        destinatários (`to`) no envio de uma SMS, ou terem números
        adicionados em massa (inclusive por upload de Excel).
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                  description: Nome do grupo de envio
              example:
                name: Clientes VIP
      parameters:
        - name: Authorization
          in: header
          required: true
          schema:
            type: string
            description: Token de autorização disponível no Portal Ombala
          example: Token a9eb6ea6-5777-4848-a9ed-8cbffc74a503
        - name: Content-Type
          in: header
          schema:
            type: string
            description: Formato do conteúdo do pedido, formato application/json,
              obrigatório.
          example: application/json
      responses:
        "201":
          description: Pedido Realizado com sucesso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SendingGroup"
    get:
      tags:
        - Grupos de Envio
      summary: Listar Grupos de Envio
      parameters:
        - name: Authorization
          in: header
          required: true
          schema:
            type: string
            description: Token de autorização disponível no Portal Ombala
          example: Token a9eb6ea6-5777-4848-a9ed-8cbffc74a503
      responses:
        "200":
          description: Pedido Realizado com sucesso
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SendingGroup"
  /v1/sending_groups/{sending_group_id}:
    get:
      tags:
        - Grupos de Envio
      summary: Listar Números de um Grupo de Envio
      parameters:
        - name: Authorization
          in: header
          required: true
          schema:
            type: string
            description: Token de autorização disponível no Portal Ombala
          example: Token a9eb6ea6-5777-4848-a9ed-8cbffc74a503
        - name: sending_group_id
          in: path
          required: true
          schema:
            type: string
          description: ID do Grupo de Envio
        - name: page
          in: query
          schema:
            type: integer
            description: Os números serão retornados em diversas páginas, pode requisitar
              uma página especifica por esse parâmentro, ele não é obrigatório.
          example: "0"
      responses:
        "200":
          description: Pedido Realizado com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  name:
                    type: string
                  members:
                    type: array
                    items:
                      $ref: "#/components/schemas/Number"
                  pagination:
                    $ref: "#/components/schemas/Pagination"
        "404":
          description: Grupo de envio inexistente
          content:
            application/json: {}
    post:
      tags:
        - Grupos de Envio
      summary: Adicionar Números a um Grupo de Envio
      description: |
        Adiciona números ao grupo. **Nota:** ao contrário dos outros
        endpoints, o corpo do pedido não é um objeto — é diretamente um
        array JSON com os registos a adicionar.
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                type: object
                required:
                  - phone_number
                properties:
                  phone_number:
                    type: string
                    description: Número no formato 9XXXXXXXX
                  name:
                    type: string
                    description: Nome associado ao número, usado para personalizar a
                      mensagem através do marcador NOME_DO_DESTINATARIO no
                      texto da SMS quando se envia para um grupo.
            example:
              - phone_number: "921939411"
                name: João
              - phone_number: "921939422"
                name: Maria
      parameters:
        - name: Authorization
          in: header
          required: true
          schema:
            type: string
            description: Token de autorização disponível no Portal Ombala
          example: Token a9eb6ea6-5777-4848-a9ed-8cbffc74a503
        - name: Content-Type
          in: header
          schema:
            type: string
            description: Formato do conteúdo do pedido, formato application/json,
              obrigatório.
          example: application/json
        - name: sending_group_id
          in: path
          required: true
          schema:
            type: string
          description: ID do Grupo de Envio
      responses:
        "201":
          description: Pedido Realizado com sucesso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SendingGroup"
        4XX:
          description: Número(s) com formato inválido
          content:
            application/json: {}
    delete:
      tags:
        - Grupos de Envio
      summary: Apagar Grupo de Envio
      parameters:
        - name: Authorization
          in: header
          required: true
          schema:
            type: string
            description: Token de autorização disponível no Portal Ombala
          example: Token a9eb6ea6-5777-4848-a9ed-8cbffc74a503
        - name: sending_group_id
          in: path
          required: true
          schema:
            type: string
          description: ID do Grupo de Envio
      responses:
        "204":
          description: Pedido Realizado com sucesso
          content:
            application/json: {}
  /v1/sending_groups/{sending_group_id}/upload:
    post:
      tags:
        - Grupos de Envio
      summary: Adicionar Números a um Grupo de Envio via Excel
      description: Faz upload de um ficheiro Excel com números para adicionar em
        massa ao grupo. O processamento do ficheiro é assíncrono.
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - excel_file
              properties:
                excel_file:
                  type: string
                  format: binary
                  description: Ficheiro Excel (.xlsx) com os números a adicionar
      parameters:
        - name: Authorization
          in: header
          required: true
          schema:
            type: string
            description: Token de autorização disponível no Portal Ombala
          example: Token a9eb6ea6-5777-4848-a9ed-8cbffc74a503
        - name: sending_group_id
          in: path
          required: true
          schema:
            type: string
          description: ID do Grupo de Envio
      responses:
        "200":
          description: Ficheiro recebido, processamento a decorrer em segundo plano
          content:
            application/json: {}
  /v1/sending_groups/{sending_group_id}/{number_id}:
    delete:
      tags:
        - Grupos de Envio
      summary: Remover um Número de um Grupo de Envio
      parameters:
        - name: Authorization
          in: header
          required: true
          schema:
            type: string
            description: Token de autorização disponível no Portal Ombala
          example: Token a9eb6ea6-5777-4848-a9ed-8cbffc74a503
        - name: sending_group_id
          in: path
          required: true
          schema:
            type: string
          description: ID do Grupo de Envio
        - name: number_id
          in: path
          required: true
          schema:
            type: string
          description: ID do Número
      responses:
        "204":
          description: Pedido Realizado com sucesso
          content:
            application/json: {}
  /v1/sub_accounts:
    post:
      tags:
        - Sub-Contas
      summary: Criar Sub-Conta
      description: |
        Cria uma sub-conta com o seu próprio `auth_token`, que pode ser usado
        para autenticar pedidos a **Enviar Mensagem** (`/v1/messages`) e aos
        endpoints de **OTP** (`/v1/otp`). O
        crédito da sub-conta é independente, mas debita também o crédito da
        conta principal a que pertence.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                  description: Nome da sub-conta
                available_sms:
                  type: integer
                  description: Créditos de SMS a atribuir inicialmente à sub-conta, não é
                    obrigatório.
              example:
                name: Loja Talatona
                available_sms: 1000
      parameters:
        - name: Authorization
          in: header
          required: true
          schema:
            type: string
            description: Token de autorização disponível no Portal Ombala
          example: Token a9eb6ea6-5777-4848-a9ed-8cbffc74a503
        - name: Content-Type
          in: header
          schema:
            type: string
            description: Formato do conteúdo do pedido, formato application/json,
              obrigatório.
          example: application/json
      responses:
        "201":
          description: Pedido Realizado com sucesso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubAccount"
    get:
      tags:
        - Sub-Contas
      summary: Listar Sub-Contas
      parameters:
        - name: Authorization
          in: header
          required: true
          schema:
            type: string
            description: Token de autorização disponível no Portal Ombala
          example: Token a9eb6ea6-5777-4848-a9ed-8cbffc74a503
      responses:
        "200":
          description: Pedido Realizado com sucesso
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SubAccount"
  /v1/sub_accounts/{sub_account_id}:
    put:
      tags:
        - Sub-Contas
      summary: Definir Crédito da Sub-Conta
      description: Define (substitui) o saldo de créditos da sub-conta para o valor
        indicado.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - credit
              properties:
                credit:
                  type: integer
                  description: Novo saldo de créditos, deve ser maior ou igual a zero
              example:
                credit: 500
      parameters:
        - name: Authorization
          in: header
          required: true
          schema:
            type: string
            description: Token de autorização disponível no Portal Ombala
          example: Token a9eb6ea6-5777-4848-a9ed-8cbffc74a503
        - name: sub_account_id
          in: path
          required: true
          schema:
            type: string
          description: ID da Sub-Conta
      responses:
        "200":
          description: Pedido Realizado com sucesso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubAccount"
        4XX:
          description: "`Crédito inválido. Deve ser maior ou igual a zero.`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/sub_accounts/{sub_account_id}/increase:
    put:
      tags:
        - Sub-Contas
      summary: Aumentar Crédito da Sub-Conta
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - credit
              properties:
                credit:
                  type: integer
                  description: Quantidade de créditos a adicionar, deve ser maior ou igual a
                    zero
              example:
                credit: 100
      parameters:
        - name: Authorization
          in: header
          required: true
          schema:
            type: string
            description: Token de autorização disponível no Portal Ombala
          example: Token a9eb6ea6-5777-4848-a9ed-8cbffc74a503
        - name: sub_account_id
          in: path
          required: true
          schema:
            type: string
          description: ID da Sub-Conta
      responses:
        "200":
          description: Pedido Realizado com sucesso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubAccount"
        4XX:
          description: "`Crédito inválido. Deve ser maior ou igual a zero.`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/sub_accounts/{sub_account_id}/decrease:
    put:
      tags:
        - Sub-Contas
      summary: Diminuir Crédito da Sub-Conta
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - credit
              properties:
                credit:
                  type: integer
                  description: Quantidade de créditos a subtrair, deve ser maior ou igual a
                    zero. Não tem efeito se o saldo atual for inferior ao
                    valor indicado.
              example:
                credit: 100
      parameters:
        - name: Authorization
          in: header
          required: true
          schema:
            type: string
            description: Token de autorização disponível no Portal Ombala
          example: Token a9eb6ea6-5777-4848-a9ed-8cbffc74a503
        - name: sub_account_id
          in: path
          required: true
          schema:
            type: string
          description: ID da Sub-Conta
      responses:
        "200":
          description: Pedido Realizado com sucesso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubAccount"
        4XX:
          description: "`Crédito inválido. Deve ser maior ou igual a zero.`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/otp:
    post:
      tags:
        - OTP
      summary: Enviar Código OTP
      description: |
        Gera um código numérico aleatório e envia-o por SMS para o número
        indicado. A SMS é cobrada como qualquer outra (normalmente 1 crédito)
        e aparece na listagem de mensagens.

        O código **não é devolvido** na resposta: guarde o `id` (ou use o
        número de telefone) para o verificar depois com **Verificar Código
        OTP**.

        Regras:
        - Pedir um novo código para o mesmo número **no mesmo `context`**
          cancela o código anterior ainda pendente desse contexto (fica
          `CANCELLED`). Códigos pendentes de outros contextos não são
          afectados.
        - Use `context` quando tiver várias aplicações ou fluxos que podem
          pedir códigos para o mesmo número ao mesmo tempo (por exemplo
          `login` e `pagamento`, ou `app-android` e `site`), para que um não
          invalide o código do outro. Sem `context`, todos os códigos sem
          contexto partilham o mesmo "grupo".
        - Por omissão não há limite de reenvios. O servidor pode ser
          configurado com um intervalo mínimo entre envios e/ou um máximo de
          envios por hora para o mesmo número e contexto; nesse caso, acima
          do limite a resposta é `429`.
        - A SMS tem um `ttl` igual à validade do código: se não for aceite
          pelo operador antes de o código expirar, não chega a ser enviada e
          o crédito é devolvido.

        Pode autenticar com o token da conta principal ou com o `auth_token`
        de uma sub-conta; nesse caso o crédito é debitado da sub-conta (e da
        conta principal) e só essa sub-conta vê e verifica o código.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - to
                - from
              properties:
                to:
                  type: string
                  description: Número de telefone do destinatário, no formato 9XXXXXXXX.
                from:
                  type: string
                  description: Remetente da SMS, deve estar previamente criado e aprovado.
                context:
                  type: string
                  description: |
                    Contexto (aplicação ou fluxo) a que o código pertence, por
                    exemplo `login`, `pagamento` ou `app-android`. Livre, até
                    100 caracteres, não é obrigatório.

                    Um novo código só cancela os códigos pendentes do mesmo
                    número **e do mesmo contexto**. Na verificação por
                    `phone_number` tem de indicar o mesmo `context`.
                  maxLength: 100
                message:
                  type: string
                  description: |
                    Texto da SMS, não é obrigatório. Tem de conter o marcador
                    `CODIGO_OTP`, que é substituído pelo código gerado.

                    Por omissão: `O seu código de verificação é CODIGO_OTP.
                    Válido por N minuto(s).`
                length:
                  type: integer
                  description: Número de dígitos do código, não é obrigatório.
                  minimum: 4
                  maximum: 8
                  default: 6
                expires_in:
                  type: integer
                  description: Validade do código em segundos, não é obrigatório. Os
                    limites são configuráveis no servidor e podem variar.
                  minimum: 60
                  maximum: 3600
                  default: 300
                max_attempts:
                  type: integer
                  description: Número máximo de tentativas de verificação. Esgotadas as
                    tentativas, o código fica `BLOCKED` e é preciso pedir um
                    novo. Não é obrigatório.
                  minimum: 1
                  maximum: 10
                  default: 5
                reference:
                  type: string
                  description: Identificador livre do seu lado (por exemplo o id do utilizador ou da
                    transacção), devolvido nas respostas. Máximo 255
                    caracteres, não é obrigatório.
                  maxLength: 255
              example:
                to: "921939411"
                from: MINHALOJA
                context: login
                message: "MINHALOJA: o seu código é CODIGO_OTP. Não o partilhe."
                length: 6
                expires_in: 300
                max_attempts: 5
                reference: user-1234
      parameters:
        - name: Authorization
          in: header
          required: true
          schema:
            type: string
            description: Token de autorização disponível no Portal Ombala, ou
              `auth_token` de uma sub-conta
          example: Token a9eb6ea6-5777-4848-a9ed-8cbffc74a503
        - name: Content-Type
          in: header
          schema:
            type: string
            description: Formato do conteúdo do pedido, formato application/json,
              obrigatório.
          example: application/json
      responses:
        "201":
          description: Código gerado e SMS enviada/em envio
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OtpVerification"
        "429":
          description: |
            Só quando o servidor tem limites de reenvio configurados (por
            omissão não tem). Limite de envios para este número e contexto
            atingido, por exemplo:
            - `aguarde {n} segundo(s) antes de pedir um novo código para este número`
            - `limite de {n} códigos por hora para este número atingido; tente mais tarde`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        4XX:
          description: |
            Houve um problema no pedido, por exemplo:
            - `remetente inválido` / `remetente pendente de aprovação`
            - `número de telefone inválido, use o formato 9XXXXXXXX`
            - `a mensagem tem de conter o marcador CODIGO_OTP`
            - `length deve ser um número inteiro entre 4 e 8`
            - `expires_in deve ser um número inteiro de segundos entre {min} e {max}`
            - `max_attempts deve ser um número inteiro entre 1 e 10`
            - `sem créditos suficientes` / `subconta sem créditos suficientes`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/otp/verify:
    post:
      tags:
        - OTP
      summary: Verificar Código OTP
      description: |
        Confirma o código introduzido pelo utilizador. Indique o `id`
        devolvido por **Enviar Código OTP** ou, em alternativa, o
        `phone_number` e o `context` usados no envio (é usado o código
        pendente mais recente desse número nesse contexto; sem `context`,
        só são considerados códigos enviados sem contexto).

        Um código só pode ser verificado com sucesso **uma vez**. Cada
        verificação (certa ou errada) conta como uma tentativa.

        Para decidir se o utilizador pode avançar, use o campo `verified`
        (ou o código HTTP 200), nunca apenas a existência de resposta.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - code
              properties:
                id:
                  type: string
                  description: ID do código OTP. Obrigatório se não indicar `phone_number`.
                phone_number:
                  type: string
                  description: Número de telefone no formato 9XXXXXXXX. Usado quando não
                    se indica o `id`.
                context:
                  type: string
                  description: Contexto indicado no envio. Com `phone_number`, escolhe o
                    código desse contexto. Com `id`, se for indicado, tem de
                    coincidir com o contexto do código (senão a resposta é
                    `404`).
                code:
                  type: string
                  description: Código introduzido pelo utilizador.
              example:
                phone_number: "921939411"
                context: login
                code: "482913"
      parameters:
        - name: Authorization
          in: header
          required: true
          schema:
            type: string
            description: Token de autorização disponível no Portal Ombala, ou
              `auth_token` de uma sub-conta
          example: Token a9eb6ea6-5777-4848-a9ed-8cbffc74a503
        - name: Content-Type
          in: header
          schema:
            type: string
            description: Formato do conteúdo do pedido, formato application/json,
              obrigatório.
          example: application/json
      responses:
        "200":
          description: Código correcto. O código fica `VERIFIED` e não pode ser usado
            outra vez.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OtpVerificationResult"
              example:
                verified: true
                id: 0b6f3c1e-8d2a-4f5b-9c7e-1a2b3c4d5e6f
                phone_number: "921939411"
                context: login
                status: VERIFIED
                attempts_remaining: 0
                expires_at: "2026-09-30T10:05:00.000Z"
                verified_at: "2026-09-30T10:01:12.000Z"
                reference: user-1234
                message_id: 545b6ca5-a481-4abe-b3b9-ce1e8a4b3629
                created_at: "2026-09-30T10:00:00.000Z"
        "422":
          description: |
            Código não verificado. `status` e a mensagem de erro indicam a
            causa:
            - `código inválido` (`PENDING`, ainda com `attempts_remaining`)
            - `número máximo de tentativas atingido; peça um novo código` (`BLOCKED`)
            - `código expirado; peça um novo código` (`EXPIRED`)
            - `código já utilizado` (`VERIFIED`)
            - `código substituído por um pedido mais recente` (`CANCELLED`)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/OtpVerificationResult"
                  - $ref: "#/components/schemas/Error"
              example:
                verified: false
                id: 0b6f3c1e-8d2a-4f5b-9c7e-1a2b3c4d5e6f
                phone_number: "921939411"
                context: login
                status: PENDING
                attempts_remaining: 4
                expires_at: "2026-09-30T10:05:00.000Z"
                verified_at: null
                reference: user-1234
                message_id: 545b6ca5-a481-4abe-b3b9-ce1e8a4b3629
                created_at: "2026-09-30T10:00:00.000Z"
                errors:
                  - message: código inválido
        "404":
          description: |
            - `código inexistente` (o `id` não existe, não pertence à conta/sub-conta
              ou não corresponde ao `context` indicado)
            - `não existe nenhum código pendente para este número neste contexto`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "400":
          description: "`código obrigatório` / `indique o id ou o phone_number`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/otp/{otp_id}:
    get:
      tags:
        - OTP
      summary: Consultar Código OTP
      description: Consulta o estado de um código OTP (sem o próprio código).
      parameters:
        - name: Authorization
          in: header
          required: true
          schema:
            type: string
            description: Token de autorização disponível no Portal Ombala, ou
              `auth_token` de uma sub-conta
          example: Token a9eb6ea6-5777-4848-a9ed-8cbffc74a503
        - name: otp_id
          in: path
          required: true
          schema:
            type: string
          description: ID do código OTP
      responses:
        "200":
          description: Pedido Realizado com sucesso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OtpVerification"
        "404":
          description: "`código inexistente`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  schemas:
    Error:
      type: object
      properties:
        errors:
          type: array
          items:
            type: object
            properties:
              message:
                type: string
                example: sem créditos suficientes
    MessageStatus:
      type: string
      description: |
        Estado do envio, do ponto de vista do destinatário:
        - `PENDING`: ainda não foi enviada ao operador (inclui o período de
          espera até um eventual `schedule` ou `ttl`).
        - `SENT`: aceite pelo operador, a aguardar confirmação de entrega.
        - `DELIVERED`: confirmação de entrega recebida.
        - `REFUSED`: não foi entregue — inclui recusas/erros do operador e
          também SMS que expiraram por `ttl` sem chegarem a ser enviadas.
      enum:
        - PENDING
        - SENT
        - DELIVERED
        - REFUSED
    Receiver:
      type: object
      properties:
        message_id:
          type: string
          description: ID deste destinatário (receiver)
        phone_number:
          type: string
        message_status:
          $ref: "#/components/schemas/MessageStatus"
    Message:
      type: object
      properties:
        id:
          type: string
        content:
          type: string
        cost:
          type: number
          description: Custo total da SMS (todas as partes e destinatários)
        schedule:
          type: string
          nullable: true
          description: Data/hora de agendamento, no formato yyyyMMddHHmmss, quando
            aplicável
        size:
          type: integer
          description: Número de caracteres da mensagem
        gsm:
          type: boolean
          description: Indica se a mensagem usa apenas caracteres do alfabeto GSM (false
            quando é necessária codificação UTF-16, por exemplo com emojis)
        parts:
          type: integer
          description: Número de partes/segmentos SMS em que a mensagem foi dividida
        from:
          type: string
          description: Nome do remetente
        created_at:
          type: string
          format: date-time
        total_recipients:
          oneOf:
            - type: integer
            - type: string
          description: Número de destinatários, ou uma mensagem informativa enquanto a
            lista de destinatários ainda está a ser construída em segundo
            plano (envios em massa)
        recipients_pending:
          type: integer
        recipients_delivered:
          type: integer
        recipients_refused:
          type: integer
        recipients:
          oneOf:
            - type: array
              items:
                $ref: "#/components/schemas/Receiver"
            - type: string
          description: Lista de destinatários, ou uma mensagem informativa enquanto a
            lista ainda está a ser construída em segundo plano (envios em
            massa)
    Pagination:
      type: object
      properties:
        total_itens:
          type: integer
        page:
          type: integer
        items_per_page:
          type: integer
        last_page:
          type: integer
    MessageList:
      type: object
      properties:
        messages:
          type: array
          items:
            $ref: "#/components/schemas/Message"
        pagination:
          $ref: "#/components/schemas/Pagination"
    Number:
      type: object
      properties:
        id:
          type: string
        phone_number:
          type: string
        name:
          type: string
    SendingGroup:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        created_at:
          type: string
          format: date-time
        members:
          type: array
          items:
            $ref: "#/components/schemas/Number"
    SubAccount:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        available_sms:
          type: integer
        auth_token:
          type: string
          description: Token a usar como Authorization ao enviar SMS em nome desta
            sub-conta
    OtpStatus:
      type: string
      description: |
        Estado do código OTP:
        - `PENDING`: enviado, à espera de verificação.
        - `VERIFIED`: verificado com sucesso (não pode ser usado outra vez).
        - `EXPIRED`: a validade (`expires_in`) terminou sem verificação.
        - `BLOCKED`: esgotou as tentativas (`max_attempts`).
        - `CANCELLED`: substituído por um novo código pedido para o mesmo número
          e o mesmo `context`.
      enum:
        - PENDING
        - VERIFIED
        - EXPIRED
        - BLOCKED
        - CANCELLED
    OtpVerification:
      type: object
      properties:
        id:
          type: string
          description: ID do código OTP, a usar em Verificar/Consultar
        phone_number:
          type: string
        context:
          type: string
          nullable: true
          description: O `context` indicado no envio
        status:
          $ref: "#/components/schemas/OtpStatus"
        attempts_remaining:
          type: integer
          description: Tentativas de verificação que ainda restam (0 se o código já
            não estiver `PENDING`)
        expires_at:
          type: string
          format: date-time
        verified_at:
          type: string
          format: date-time
          nullable: true
        reference:
          type: string
          nullable: true
          description: O `reference` indicado no envio
        message_id:
          type: string
          description: ID da mensagem (SMS) enviada com o código
        created_at:
          type: string
          format: date-time
    OtpVerificationResult:
      allOf:
        - type: object
          properties:
            verified:
              type: boolean
              description: true apenas quando o código foi aceite neste pedido
        - $ref: "#/components/schemas/OtpVerification"
