openapi: 3.0.0
info:
  title: Ombala API
  version: 1.0.0
servers:
  - url: https://api.useombala.ao
tags:
  - name: Mensagens
  - name: Remetentes
  - name: Créditos
  - name: Grupos de Envio
    description: |
      Grupos de números (com nome opcional) para envio em massa.

      ## Enviar Mensagem para Grupo

      Para enviar uma SMS a todos os números de um grupo, use o endpoint
      **Enviar Mensagem** (`POST /v1/messages`) e indique no parâmetro `to`
      o ID do Grupo de Envio, em vez de uma lista de números.

      ### Personalizar a mensagem com o nome do destinatário

      Pode personalizar a mensagem para cada membro do grupo colocando o
      marcador `NOME_DO_DESTINATARIO` no texto. Para cada membro, o marcador
      é substituído pelo nome associado ao seu número.

      Passos:
      1. Criar o grupo com **Criar Grupo de Envio**.
      2. Adicionar os números com o respetivo nome, através de **Adicionar
         Números a um Grupo de Envio** (campo `name`) ou de **Adicionar
         Números a um Grupo de Envio via Excel** (coluna `nome`).
      3. Enviar a mensagem com o ID do grupo em `to` e o marcador
         `NOME_DO_DESTINATARIO` no texto.

      Exemplo de pedido:

      ```json
      {
        "message": "Olá NOME_DO_DESTINATARIO, a sua encomenda está pronta.",
        "from": "MINHALOJA",
        "to": "ID_DO_GRUPO"
      }
      ```

      Resultado:
      - O João recebe: `Olá João, a sua encomenda está pronta.`
      - A Maria recebe: `Olá Maria, a sua encomenda está pronta.`

      Notas:
      - O marcador tem de estar escrito exatamente assim (em maiúsculas,
        com underscores) e pode aparecer várias vezes no texto.
      - Se um número do grupo não tiver nome, o marcador é substituído por
        texto vazio (ex.: `Olá , a sua encomenda está pronta.`).
      - A personalização só se aplica ao envio para grupos; numa lista de
        números em `to`, o texto é enviado tal como está.
      - O custo é calculado com o texto final de cada destinatário: um nome
        longo ou com acentos pode fazer a SMS ocupar mais partes e, por
        isso, consumir mais créditos.
  - name: Sub-Contas
  - name: OTP
    description: |
      Envio e verificação de códigos de uso único (OTP) por SMS, para validar
      números de telefone, logins ou transacções dos seus utilizadores.

      Fluxo: pedir o envio com **Enviar Código OTP**, receber o código que o
      utilizador introduz na sua aplicação e confirmá-lo com **Verificar
      Código OTP**. Com várias aplicações ou fluxos para os mesmos números,
      use o parâmetro `context` para que os códigos de um não cancelem os do
      outro. O Ombala gera o código, guarda-o de forma segura (nunca
      o devolve pela API) e controla a validade, o número de tentativas e os
      reenvios.
  - name: Callbacks
    description: |
      Receba no seu sistema uma notificação (webhook) sempre que o estado de
      envio de uma SMS muda, em vez de consultar a API periodicamente.

      ## Configurar o callback

      1. Defina o URL com **Definir Callback** (`PUT /v1/callback`). A resposta
         inclui o `secret` usado para assinar as notificações: guarde-o em
         segurança.
      2. Confirme a integração com **Testar Callback**.
      3. Envie as SMS normalmente. Em **Enviar Mensagem** também pode indicar um
         `callback_url`, que substitui o da conta apenas para essa mensagem.

      Requisitos do URL:
      - tem de usar `https`;
      - tem de ser acessível publicamente (não são aceites endereços privados,
        locais ou de rede interna);
      - máximo de 2048 caracteres.

      As mensagens enviadas com o token de uma sub-conta usam o callback da
      conta principal; o evento indica o `sub_account_id`. Os endpoints de
      configuração do callback só aceitam o token da conta principal.

      ## Eventos de estado

      Por cada mudança de estado de cada destinatário, o Ombala faz um `POST`
      ao seu URL com um corpo JSON como este:

      ```json
      {
        "event_id": "5f0c6a1e-3b7d-4a49-9c55-2b8e4f0d7a11",
        "event": "message.status",
        "message_id": "0b9a3c1e-8f6d-4c2a-9e7b-1d5f3a8c6e42",
        "parent_id": "b9eb6ea6-5117-4848-a9ed-8cbffc74a991",
        "phone_number": "923456789",
        "status": "DELIVERED",
        "error_code": "000",
        "sub_account_id": null,
        "occurred_at": "2026-11-26T10:15:00Z"
      }
      ```

      | Campo | Descrição |
      |---|---|
      | `event_id` | ID único da notificação. Use-o para ignorar notificações repetidas. |
      | `event` | `message.status` (ou `test`, no evento de teste) |
      | `message_id` | ID do destinatário, o mesmo `message_id` devolvido em **Obter Mensagem** |
      | `parent_id` | ID da mensagem, devolvido em **Enviar Mensagem** |
      | `phone_number` | Número do destinatário |
      | `status` | Novo estado (ver abaixo) |
      | `error_code` | Código de erro do operador, quando existir |
      | `sub_account_id` | Sub-conta que enviou a mensagem, ou `null` |
      | `occurred_at` | Momento da mudança de estado (UTC, ISO 8601) |

      Estados notificados:
      - `SENT`: aceite pelo operador, a aguardar confirmação de entrega. Pode
        ser desligado com `include_sent: false` em **Definir Callback**, para
        receber apenas os estados finais.
      - `DELIVERED`: entregue ao destinatário.
      - `REFUSED`: não foi entregue. Inclui recusas ou erros do operador e SMS
        que expiraram por `ttl`.
      - `CANCELLED`: cancelada antes de ser enviada (ver **Cancelar Mensagem
        Agendada**).

      `PENDING` nunca é notificado, porque é o estado inicial de todas as SMS.

      Regras a ter em conta na sua integração:
      - Cada estado é notificado no máximo uma vez por destinatário, mas a
        mesma notificação pode chegar mais do que uma vez (por exemplo, se o
        seu servidor a processar mas responder fora do prazo). Use o `event_id`
        para ignorar duplicados.
      - A ordem de chegada não é garantida: uma notificação `SENT` que precisou
        de novas tentativas pode chegar depois do `DELIVERED`. Nunca substitua
        um estado final (`DELIVERED`, `REFUSED`, `CANCELLED`) por `SENT`.
      - Excecionalmente, o operador pode corrigir um estado final (por exemplo,
        `REFUSED` seguido de `DELIVERED`); nesse caso recebe as duas
        notificações e o estado correto é o da mais recente (`occurred_at`).

      ## Responder à notificação

      Responda com qualquer código `2xx` em menos de 5 segundos. Se precisar
      de fazer trabalho demorado, guarde a notificação e processe-a depois.
      Redirecionamentos (`3xx`) não são seguidos e contam como falha.

      ## Novas tentativas e histórico

      Se o seu servidor não responder `2xx` dentro do prazo, ou não estiver
      acessível, o Ombala volta a tentar até 10 vezes, com intervalos cada vez
      maiores, durante cerca de 4 horas. Esgotadas as tentativas, a
      notificação fica no estado `FAILED` e pode ser reenviada com **Reenviar
      Entrega**.

      Todas as notificações, com o número de tentativas e a última resposta do
      seu servidor, podem ser consultadas em **Listar Entregas** durante 30
      dias.

      ## Verificar a assinatura

      Cada pedido inclui estes cabeçalhos:

      | Cabeçalho | Descrição |
      |---|---|
      | `X-Ombala-Event` | Tipo de evento (`message.status` ou `test`) |
      | `X-Ombala-Delivery` | ID da notificação (igual ao `event_id`) |
      | `X-Ombala-Timestamp` | Momento do envio, em segundos desde 1970 (Unix) |
      | `X-Ombala-Signature` | `sha256=` seguido do HMAC-SHA256, em hexadecimal |

      A assinatura é o HMAC-SHA256 do texto
      `<X-Ombala-Timestamp>.<corpo do pedido>`, calculado com o seu `secret`.
      Para confirmar que a notificação vem do Ombala:
      1. calcule o HMAC sobre o corpo exatamente como foi recebido (antes de
         o converter de JSON);
      2. compare-o com `X-Ombala-Signature` com uma comparação de tempo
         constante;
      3. rejeite pedidos com `X-Ombala-Timestamp` com mais de 5 minutos, para
         evitar a reutilização de pedidos antigos.

      Node.js (Express):

      ```javascript
      const crypto = require('crypto');

      app.post('/ombala/callback', express.raw({ type: 'application/json' }), (req, res) => {
        const timestamp = req.get('X-Ombala-Timestamp');
        const expected = 'sha256=' + crypto
          .createHmac('sha256', process.env.OMBALA_CALLBACK_SECRET)
          .update(`${timestamp}.${req.body}`)
          .digest('hex');
        const received = req.get('X-Ombala-Signature') || '';

        const valid = received.length === expected.length &&
          crypto.timingSafeEqual(Buffer.from(received), Buffer.from(expected)) &&
          Math.abs(Date.now() / 1000 - Number(timestamp)) < 300;
        if (!valid) return res.sendStatus(401);

        const event = JSON.parse(req.body);
        // guardar o evento e processá-lo depois
        res.sendStatus(200);
      });
      ```

      PHP:

      ```php
      $body = file_get_contents('php://input');
      $timestamp = $_SERVER['HTTP_X_OMBALA_TIMESTAMP'] ?? '';
      $received = $_SERVER['HTTP_X_OMBALA_SIGNATURE'] ?? '';
      $expected = 'sha256=' . hash_hmac('sha256', $timestamp . '.' . $body, getenv('OMBALA_CALLBACK_SECRET'));

      if (!hash_equals($expected, $received) || abs(time() - (int) $timestamp) > 300) {
          http_response_code(401);
          exit;
      }

      $event = json_decode($body, true);
      http_response_code(200);
      ```

      Python (Flask):

      ```python
      import hashlib, hmac, os, time
      from flask import request, abort

      @app.post('/ombala/callback')
      def ombala_callback():
          timestamp = request.headers.get('X-Ombala-Timestamp', '')
          body = request.get_data()
          expected = 'sha256=' + hmac.new(os.environ['OMBALA_CALLBACK_SECRET'].encode(),
                                          timestamp.encode() + b'.' + body, hashlib.sha256).hexdigest()
          received = request.headers.get('X-Ombala-Signature', '')
          if not hmac.compare_digest(expected, received) or abs(time.time() - int(timestamp or 0)) > 300:
              abort(401)
          event = request.get_json()
          return '', 200
      ```
paths:
  /v1/messages:
    post:
      tags:
        - Mensagens
      summary: Enviar Mensagem
      description: |
        Permite enviar uma SMS para um ou mais números de telefone.

        A autenticação pode ser feita com o token da conta principal ou com o
        `auth_token` de uma sub-conta (ver secção **Sub-Contas**); nesse caso o
        crédito é debitado da sub-conta (e da conta principal) e a mensagem
        fica associada a ela.

      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - message
                - from
                - to
              properties:
                message:
                  type: string
                  description: Texto da mensagem
                  required: true
                from:
                  type: string
                  description: Remetente da mensagem, deve estar previamente criado e aprovado.
                  required: true
                to:
                  type: string
                  description: Lista de número(s) destinatário(s) da mensagem, separados por
                    vírgula. Em alternativa, pode ser o ID de um Grupo de Envio,
                    para enviar a todos os números desse grupo (mais detalhes
                    em [Enviar Mensagem para Grupo](#tag/Grupos-de-Envio/Enviar-Mensagem-para-Grupo)).
                  required: true
                schedule:
                  type: string
                  description: Data e hora para o envio da SMS, no formato yyyyMMddHHmmss, ideal
                    para agendar o envio de uma SMS, não é um parâmetro
                    obrigatório. Tem de ser uma data/hora futura.
                  format: date-time
                  required: false
                ttl:
                  type: integer
                  description: |
                    Tempo de vida da SMS em segundos, não é um parâmetro obrigatório.

                    Se a SMS ainda estiver pendente (isto é, ainda não foi aceite
                    pelo operador/SMSC) quando este prazo expirar, o envio é
                    cancelado automaticamente, o estado passa a expirado
                    (visível como `REFUSED` no `message_status`) e o crédito
                    gasto é devolvido à conta (e à sub-conta, se aplicável).

                    Se a mensagem tiver `schedule`, a contagem do `ttl` começa
                    a partir da data/hora agendada, não da data de criação do
                    pedido.

                    Tem de ser um número inteiro de segundos entre 60 (1
                    minuto) e 604800 (7 dias); estes limites são configuráveis
                    no servidor e podem variar.
                  minimum: 60
                  maximum: 604800
                  required: false
                callback_url:
                  type: string
                  description: |
                    URL notificado a cada mudança de estado dos destinatários desta
                    mensagem, não é um parâmetro obrigatório. Substitui o callback
                    da conta apenas para esta mensagem. Tem de usar `https` e ser
                    acessível publicamente. Ver a secção **Callbacks**.
                  required: false
              example:
                message: Mensagem de teste.
                from: MINHALOJA
                to: "921939411"
                schedule: "20231015182000"
                ttl: 3600
      parameters:
        - name: Authorization
          in: header
          schema:
            type: string
            description: Token de autorização disponível no Portal Ombala
          example: Token a9eb6ea6-5777-4848-a9ed-8cbffc74a503
        - name: Content-Type
          in: header
          schema:
            type: string
            description: Formato do conteúdo do pedido, formato application/json,
              obrigatório.
          example: application/json
      responses:
        "201":
          description: Mensagem enviada/agendada com sucesso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        4XX:
          description: |
            Houve um problema no pedido. Haverá uma descrição clara da causa
            do erro, por exemplo:
            - `remetente inválido` / `remetente pendente de aprovação`
            - `destinatário não pode estar vazio` / `destinatário {numero} tem o formato inválido`
            - `sem créditos suficientes` / `subconta sem créditos suficientes`
            - `data de agendamento não está no formato yyyyMMddHHmmss` / `data de agendamento está no passado`
            - `ttl deve ser um número inteiro de segundos entre {min} e {max}`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    get:
      tags:
        - Mensagens
      summary: Listar Mensagens
      parameters:
        - name: Authorization
          in: header
          schema:
            type: string
            description: Token de autorização disponível no Portal Ombala
          example: Token a9eb6ea6-5777-4848-a9ed-8cbffc74a503
        - name: page
          in: query
          schema:
            type: integer
            description: As mensagens serão retornadas em diversas páginas, pode requisitar
              uma página especifica por esse parâmentro, ele não é obrigatório.
          example: "0"
      responses:
        "200":
          description: Pedido Realizado com sucesso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageList"
  /v1/messages/{message_id}:
    delete:
      tags:
        - Mensagens
      summary: Delete
      description: |
        Apagar o registro de envio de uma SMS (deixa de aparecer nas
        listagens).

        **Atenção:** apagar não cancela o envio. Para impedir o envio de uma
        mensagem agendada e recuperar o crédito, use primeiro **Cancelar
        Mensagem Agendada**.
      parameters:
        - name: Authorization
          in: header
          schema:
            type: string
            description: Token de autorização disponível no Portal Ombala
          example: Token a9eb6ea6-5777-4848-a9ed-8cbffc74a503
        - name: message_id
          in: path
          required: true
          schema:
            type: string
            description: ID da mensagem
          example: b9eb6ea6-5117-4848-a9ed-8cbffc74a991
      responses:
        "204":
          description: Pedido Realizado com sucesso
          content:
            application/json: {}
        "404":
          description: Mensagem inexistente (ou não pertence à conta autenticada)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/messages/{message_id}/cancel:
    post:
      tags:
        - Mensagens
      summary: Cancelar Mensagem Agendada
      description: |
        Cancela uma mensagem enviada com `schedule` definido. Os destinatários que
        ainda não foram enviados ao operador passam ao estado `CANCELLED`,
        não chegam a ser enviados e o crédito gasto com eles é devolvido à
        conta (e à sub-conta, se aplicável). O momento do cancelamento fica
        registado em `cancelled_at`.

        Destinatários já enviados ao operador (por exemplo, se a hora do
        agendamento já tiver chegado e o envio estiver a decorrer) não podem
        ser cancelados e seguem o fluxo normal; são contados em
        `already_sent`.
      parameters:
        - name: Authorization
          in: header
          schema:
            type: string
            description: Token de autorização disponível no Portal Ombala
          example: Token a9eb6ea6-5777-4848-a9ed-8cbffc74a503
        - name: message_id
          in: path
          required: true
          schema:
            type: string
            description: ID da mensagem
          example: b9eb6ea6-5117-4848-a9ed-8cbffc74a991
      responses:
        "200":
          description: Mensagem cancelada
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    description: ID da mensagem
                  cancelled:
                    type: integer
                    description: Destinatários cancelados (não serão enviados)
                  already_sent:
                    type: integer
                    description: Destinatários que já tinham sido enviados ao operador e
                      não foram cancelados
                  refunded_sms:
                    type: integer
                    description: Créditos de SMS devolvidos à conta
                  cancelled_at:
                    type: string
                    format: date-time
                    description: Momento do cancelamento
              example:
                id: b9eb6ea6-5117-4848-a9ed-8cbffc74a991
                cancelled: 1840
                already_sent: 0
                refunded_sms: 1840
                cancelled_at: "2026-10-17T10:15:00.000+01:00"
        "400":
          description: |
            - `só é possível cancelar mensagens agendadas`
            - `mensagem já cancelada`
            - `não há destinatários por enviar nesta mensagem; nada a cancelar`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Mensagem inexistente (ou não pertence à conta autenticada)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/messages/recipients:
    get:
      tags:
        - Mensagens
      summary: Listar destinatários
      description: Listar todos os números que já foram alvo de uma SMS através da sua conta
      parameters:
        - name: Authorization
          in: header
          schema:
            type: string
            description: Token de autorização disponível no Portal Ombala
          example: Token a9eb6ea6-5777-4848-a9ed-8cbffc74a503
        - name: page
          in: query
          schema:
            type: integer
            description: As mensagens serão retornadas em diversas páginas, pode requisitar
              uma página especifica por esse parâmentro, ele não é obrigatório.
          example: "1"
      responses:
        "200":
          description: Pedido Realizado com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  recipients:
                    type: array
                    items:
                      type: object
                      properties:
                        phone_number:
                          type: string
                          example: "921939455"
                  pagination:
                    $ref: "#/components/schemas/Pagination"
  /v1/messages/date:
    get:
      tags:
        - Mensagens
      summary: Listar Mensagens Intervalo de datas
      description: Listar todas as mensagens envidas dentro de um intervalo de datas
      parameters:
        - name: Authorization
          in: header
          schema:
            type: string
            description: Token de autorização disponível no Portal Ombala
          example: Token a9eb6ea6-5777-4848-a9ed-8cbffc74a503
        - name: start
          in: query
          description: Data de início da consulta, no formato YYYYMMDD
          required: true
          schema:
            type: integer
          example: "20231011"
        - name: end
          in: query
          description: Data de fim da consulta, no formato YYYYMMDD
          required: true
          schema:
            type: integer
          example: "20231020"
        - name: page
          in: query
          schema:
            type: integer
            description: As mensagens serão retornadas em diversas páginas, pode requisitar
              uma página especifica por esse parâmentro, ele não é obrigatório.
          example: "1"
      responses:
        "200":
          description: Pedido Realizado com sucesso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageList"
  /v1/messages/recipient:
    get:
      tags:
        - Mensagens
      summary: Listas de mensagens de um número/destinatário
      parameters:
        - name: Authorization
          in: header
          schema:
            type: string
            description: Token de autorização disponível no Portal Ombala
          example: Token a9eb6ea6-5777-4848-a9ed-8cbffc74a503
        - name: phone_number
          in: query
          schema:
            type: integer
          example: "921939455"
        - name: page
          in: query
          schema:
            type: integer
            description: Os resultados serão retornadas em diversas páginas, pode requisitar
              uma página especifica por esse parâmentro, ele não é obrigatório.
          example: "0"
      responses:
        "200":
          description: Pedido Realizado com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  messages:
                    type: array
                    items:
                      type: object
                      properties:
                        message_id:
                          type: string
                          description: ID do registo do destinatário (receiver) desta SMS
                        parent_id:
                          type: string
                          description: ID da mensagem
                        content:
                          type: string
                        message_status:
                          $ref: "#/components/schemas/MessageStatus"
                        created_at:
                          type: string
                          format: date-time
                  pagination:
                    $ref: "#/components/schemas/Pagination"
  /v1/messages/one:
    get:
      tags:
        - Mensagens
      summary: Mostrar mensagem ou destinatário por ID
      description: |
        Consulta um único registo. Consoante o parâmetro usado, devolve
        coisas diferentes — **usar apenas um dos dois de cada vez**:
        - `id` → devolve a mensagem completa (com todos os destinatários).
        - `message_id` → devolve o estado de um único destinatário
          (equivalente a um item de `recipients` dentro da mensagem).

        Nota: apesar do nome, `message_id` aqui identifica o registo do
        destinatário (receiver), não a mensagem — para a mensagem completa
        deve usar-se o parâmetro `id`.
      parameters:
        - name: Authorization
          in: header
          schema:
            type: string
            description: Token de autorização disponível no Portal Ombala
          example: Token a9eb6ea6-5777-4848-a9ed-8cbffc74a503
        - name: id
          in: query
          description: ID da Mensagem. Devolve a mensagem completa.
          schema:
            type: string
          example: 545b6ca5-a481-4abe-b3b9-ce1e8a4b3629
        - name: message_id
          in: query
          description: ID do destinatário (receiver) de uma mensagem. Devolve apenas
            esse destinatário.
          schema:
            type: string
          example: 545b6ca5-a481-4abe-b3b9-ce1e8a4b3629
      responses:
        "200":
          description: Pedido Realizado com sucesso
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/Message"
                  - $ref: "#/components/schemas/Receiver"
        "404":
          description: Mensagem/destinatário inexistente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/senders/:
    post:
      tags:
        - Remetentes
      summary: Criar Remetente
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: Nome do remente da SMS. Máximo de 11 caracteres e apenas
                    caracteres suportados pelo alfabeto GSM (não pode conter
                    emojis ou outros caracteres que obriguem a codificação
                    UTF-16).
                  maxLength: 11
                  required: true
              example:
                name: LOJAHEBER
      parameters:
        - name: Authorization
          in: header
          schema:
            type: string
            description: Token de autorização disponível no Portal Ombala
          example: Token a9eb6ea6-5777-4848-a9ed-8cbffc74a503
        - name: Content-Type
          in: header
          schema:
            type: string
            description: Formato do conteúdo do pedido, formato application/json,
              obrigatório.
          example: application/json
      responses:
        "201":
          description: Pedido Realizado com sucesso
          content:
            application/json: {}
        4XX:
          description: |
            Houve um problema no pedido, por exemplo:
            - `remetente já cadastrado`
            - `remetente não pode conter caracteres que não sejam GSM`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
