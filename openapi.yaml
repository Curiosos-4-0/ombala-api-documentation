            description: Token de autorização disponível no Portal Ombala
          example: Token a9eb6ea6-5777-4848-a9ed-8cbffc74a503
      responses:
        "200":
          description: Pedido Realizado com sucesso
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SendingGroup"
  /v1/sending_groups/{sending_group_id}:
    get:
      tags:
        - Grupos de Envio
      summary: Listar Números de um Grupo de Envio
      parameters:
        - name: Authorization
          in: header
          required: true
          schema:
            type: string
            description: Token de autorização disponível no Portal Ombala
          example: Token a9eb6ea6-5777-4848-a9ed-8cbffc74a503
        - name: sending_group_id
          in: path
          required: true
          schema:
            type: string
          description: ID do Grupo de Envio
        - name: page
          in: query
          schema:
            type: integer
            description: Os números serão retornados em diversas páginas, pode requisitar
              uma página especifica por esse parâmentro, ele não é obrigatório.
          example: "0"
      responses:
        "200":
          description: Pedido Realizado com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  name:
                    type: string
                  members:
                    type: array
                    items:
                      $ref: "#/components/schemas/Number"
                  pagination:
                    $ref: "#/components/schemas/Pagination"
        "404":
          description: Grupo de envio inexistente
          content:
            application/json: {}
    post:
      tags:
        - Grupos de Envio
      summary: Adicionar Números a um Grupo de Envio
      description: |
        Adiciona números ao grupo. **Nota:** ao contrário dos outros
        endpoints, o corpo do pedido não é um objeto — é diretamente um
        array JSON com os registos a adicionar.
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                type: object
                required:
                  - phone_number
                properties:
                  phone_number:
                    type: string
                    description: Número no formato 9XXXXXXXX
                  name:
                    type: string
                    description: Nome associado ao número, usado para personalizar a
                      mensagem através do marcador NOME_DO_DESTINATARIO no
                      texto da SMS quando se envia para um grupo.
            example:
              - phone_number: "921939411"
                name: João
              - phone_number: "921939422"
                name: Maria
      parameters:
        - name: Authorization
          in: header
          required: true
          schema:
            type: string
            description: Token de autorização disponível no Portal Ombala
          example: Token a9eb6ea6-5777-4848-a9ed-8cbffc74a503
        - name: Content-Type
          in: header
          schema:
            type: string
            description: Formato do conteúdo do pedido, formato application/json,
              obrigatório.
          example: application/json
        - name: sending_group_id
          in: path
          required: true
          schema:
            type: string
          description: ID do Grupo de Envio
      responses:
        "201":
          description: Pedido Realizado com sucesso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SendingGroup"
        4XX:
          description: Número(s) com formato inválido
          content:
            application/json: {}
    delete:
      tags:
        - Grupos de Envio
      summary: Apagar Grupo de Envio
      parameters:
        - name: Authorization
          in: header
          required: true
          schema:
            type: string
            description: Token de autorização disponível no Portal Ombala
          example: Token a9eb6ea6-5777-4848-a9ed-8cbffc74a503
        - name: sending_group_id
          in: path
          required: true
          schema:
            type: string
          description: ID do Grupo de Envio
      responses:
        "204":
          description: Pedido Realizado com sucesso
          content:
            application/json: {}
  /v1/sending_groups/{sending_group_id}/upload:
    post:
      tags:
        - Grupos de Envio
      summary: Adicionar Números a um Grupo de Envio via Excel
      description: |
        Faz upload de um ficheiro Excel com números para adicionar em
        massa ao grupo. O processamento do ficheiro é assíncrono.

        A primeira linha deve ter os cabeçalhos: uma coluna com os números
        (`telefone`, `numero`, `phone` ou `contacto`) e, opcionalmente, uma
        coluna com os nomes (`nome` ou `name`). Os nomes são usados para
        personalizar mensagens com o marcador `NOME_DO_DESTINATARIO`.
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - excel_file
              properties:
                excel_file:
                  type: string
                  format: binary
                  description: Ficheiro Excel (.xlsx) com os números a adicionar
      parameters:
        - name: Authorization
          in: header
          required: true
          schema:
            type: string
            description: Token de autorização disponível no Portal Ombala
          example: Token a9eb6ea6-5777-4848-a9ed-8cbffc74a503
        - name: sending_group_id
          in: path
          required: true
          schema:
            type: string
          description: ID do Grupo de Envio
      responses:
        "200":
          description: Ficheiro recebido, processamento a decorrer em segundo plano
          content:
            application/json: {}
  /v1/sending_groups/{sending_group_id}/{number_id}:
    delete:
      tags:
        - Grupos de Envio
      summary: Remover um Número de um Grupo de Envio
      parameters:
        - name: Authorization
          in: header
          required: true
          schema:
            type: string
            description: Token de autorização disponível no Portal Ombala
          example: Token a9eb6ea6-5777-4848-a9ed-8cbffc74a503
        - name: sending_group_id
          in: path
          required: true
          schema:
            type: string
          description: ID do Grupo de Envio
        - name: number_id
          in: path
          required: true
          schema:
            type: string
          description: ID do Número
      responses:
        "204":
          description: Pedido Realizado com sucesso
          content:
            application/json: {}
  /v1/sub_accounts:
    post:
      tags:
        - Sub-Contas
      summary: Criar Sub-Conta
      description: |
        Cria uma sub-conta com o seu próprio `auth_token`, que pode ser usado
        para autenticar pedidos a **Enviar Mensagem** (`/v1/messages`) e aos
        endpoints de **OTP** (`/v1/otp`). O
        crédito da sub-conta é independente, mas debita também o crédito da
        conta principal a que pertence.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                  description: Nome da sub-conta
                available_sms:
                  type: integer
                  description: Créditos de SMS a atribuir inicialmente à sub-conta, não é
                    obrigatório.
              example:
                name: Loja Talatona
                available_sms: 1000
      parameters:
        - name: Authorization
          in: header
          required: true
          schema:
            type: string
            description: Token de autorização disponível no Portal Ombala
          example: Token a9eb6ea6-5777-4848-a9ed-8cbffc74a503
        - name: Content-Type
          in: header
          schema:
            type: string
            description: Formato do conteúdo do pedido, formato application/json,
              obrigatório.
          example: application/json
      responses:
        "201":
          description: Pedido Realizado com sucesso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubAccount"
    get:
      tags:
        - Sub-Contas
      summary: Listar Sub-Contas
      parameters:
        - name: Authorization
          in: header
          required: true
          schema:
            type: string
            description: Token de autorização disponível no Portal Ombala
          example: Token a9eb6ea6-5777-4848-a9ed-8cbffc74a503
      responses:
        "200":
          description: Pedido Realizado com sucesso
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SubAccount"
  /v1/sub_accounts/{sub_account_id}:
    put:
      tags:
        - Sub-Contas
      summary: Definir Crédito da Sub-Conta
      description: Define (substitui) o saldo de créditos da sub-conta para o valor
        indicado.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - credit
              properties:
                credit:
                  type: integer
                  description: Novo saldo de créditos, deve ser maior ou igual a zero
              example:
                credit: 500
      parameters:
        - name: Authorization
          in: header
          required: true
          schema:
            type: string
            description: Token de autorização disponível no Portal Ombala
          example: Token a9eb6ea6-5777-4848-a9ed-8cbffc74a503
        - name: sub_account_id
          in: path
          required: true
          schema:
            type: string
          description: ID da Sub-Conta
      responses:
        "200":
          description: Pedido Realizado com sucesso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubAccount"
        4XX:
          description: "`Crédito inválido. Deve ser maior ou igual a zero.`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/sub_accounts/{sub_account_id}/increase:
    put:
      tags:
        - Sub-Contas
      summary: Aumentar Crédito da Sub-Conta
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - credit
              properties:
                credit:
                  type: integer
                  description: Quantidade de créditos a adicionar, deve ser maior ou igual a
                    zero
              example:
                credit: 100
      parameters:
        - name: Authorization
          in: header
          required: true
          schema:
            type: string
            description: Token de autorização disponível no Portal Ombala
          example: Token a9eb6ea6-5777-4848-a9ed-8cbffc74a503
        - name: sub_account_id
          in: path
          required: true
          schema:
            type: string
          description: ID da Sub-Conta
      responses:
        "200":
          description: Pedido Realizado com sucesso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubAccount"
        4XX:
          description: "`Crédito inválido. Deve ser maior ou igual a zero.`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/sub_accounts/{sub_account_id}/decrease:
    put:
      tags:
        - Sub-Contas
      summary: Diminuir Crédito da Sub-Conta
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - credit
              properties:
                credit:
                  type: integer
                  description: Quantidade de créditos a subtrair, deve ser maior ou igual a
                    zero. Não tem efeito se o saldo atual for inferior ao
                    valor indicado.
              example:
                credit: 100
      parameters:
        - name: Authorization
          in: header
          required: true
          schema:
            type: string
            description: Token de autorização disponível no Portal Ombala
          example: Token a9eb6ea6-5777-4848-a9ed-8cbffc74a503
        - name: sub_account_id
          in: path
          required: true
          schema:
            type: string
          description: ID da Sub-Conta
      responses:
        "200":
          description: Pedido Realizado com sucesso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubAccount"
        4XX:
          description: "`Crédito inválido. Deve ser maior ou igual a zero.`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/callback:
    get:
      tags:
        - Callbacks
      summary: Obter Callback
      description: |
        Devolve o callback configurado na conta. Se não houver nenhum, `url` e
        `secret` vêm a `null`.
      parameters:
        - name: Authorization
          in: header
          schema:
            type: string
            description: Token de autorização da conta principal, disponível no Portal Ombala
          example: Token a9eb6ea6-5777-4848-a9ed-8cbffc74a503
      responses:
        "200":
          description: Callback da conta
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CallbackConfig"
    put:
      tags:
        - Callbacks
      summary: Definir Callback
      description: |
        Define ou altera o URL notificado sempre que o estado de uma SMS muda (ver
        a secção **Callbacks**). Na primeira configuração é gerado o `secret`
        usado para assinar as notificações; alterar o URL mantém o mesmo
        `secret`.
      parameters:
        - name: Authorization
          in: header
          schema:
            type: string
            description: Token de autorização da conta principal, disponível no Portal Ombala
          example: Token a9eb6ea6-5777-4848-a9ed-8cbffc74a503
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - url
              properties:
                url:
                  type: string
                  description: URL `https`, acessível publicamente, até 2048 caracteres.
                include_sent:
                  type: boolean
                  description: |
                    Se o estado `SENT` (aceite pelo operador) também é notificado.
                    Com `false`, recebe apenas os estados finais. Se não for
                    indicado, mantém o valor atual (por omissão `true`).
            example:
              url: https://www.minhaloja.ao/ombala/callback
              include_sent: true
      responses:
        "200":
          description: Callback definido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CallbackConfig"
        "400":
          description: |
            - `o URL de callback não pode estar vazio`
            - `o URL de callback é inválido`
            - `o URL de callback tem de usar https`
            - `o URL de callback não pode conter credenciais`
            - `não foi possível resolver o host do URL de callback`
            - `o URL de callback tem de apontar para um endereço público`
            - `o URL de callback não pode ter mais de 2048 caracteres`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      tags:
        - Callbacks
      summary: Remover Callback
      description: |
        Desliga o callback da conta: deixam de ser enviadas notificações, exceto
        para mensagens enviadas com o seu próprio `callback_url`. As
        notificações já em curso continuam a ser entregues.
      parameters:
        - name: Authorization
          in: header
          schema:
            type: string
            description: Token de autorização da conta principal, disponível no Portal Ombala
          example: Token a9eb6ea6-5777-4848-a9ed-8cbffc74a503
      responses:
        "204":
          description: Callback removido
  /v1/callback/secret/reset:
    post:
      tags:
        - Callbacks
      summary: Renovar Segredo do Callback
      description: |
        Gera um novo `secret` para assinar as notificações. O anterior deixa de
        ser usado de imediato, por isso atualize-o no seu sistema logo a
        seguir.
      parameters:
        - name: Authorization
          in: header
          schema:
            type: string
            description: Token de autorização da conta principal, disponível no Portal Ombala
          example: Token a9eb6ea6-5777-4848-a9ed-8cbffc74a503
      responses:
        "200":
          description: Novo segredo
          content:
            application/json:
              schema:
                type: object
                properties:
                  secret:
                    type: string
              example:
                secret: whsec_6f1d0c9a8b7e6d5c4b3a29180f7e6d5c4b3a2918
  /v1/callback/test:
    post:
      tags:
        - Callbacks
      summary: Testar Callback
      description: |
        Envia de imediato um evento `test` para o callback da conta e devolve o
        resultado, para validar a integração (incluindo a verificação da
        assinatura). Ao contrário dos eventos de estado, o teste não tem novas
        tentativas: se falhar, fica `FAILED`.

        Corpo enviado:

        ```json
        {
          "event_id": "5f0c6a1e-3b7d-4a49-9c55-2b8e4f0d7a11",
          "event": "test",
          "message": "Evento de teste do Ombala",
          "occurred_at": "2026-11-26T10:15:00Z"
        }
        ```
      parameters:
        - name: Authorization
          in: header
          schema:
            type: string
            description: Token de autorização da conta principal, disponível no Portal Ombala
          example: Token a9eb6ea6-5777-4848-a9ed-8cbffc74a503
      responses:
        "200":
          description: Resultado da tentativa (`DELIVERED` ou `FAILED`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CallbackDelivery"
        "400":
          description: "`não há nenhum callback configurado`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/callback/deliveries:
    get:
      tags:
        - Callbacks
      summary: Listar Entregas
      description: |
        Histórico das notificações enviadas para o callback (dos últimos 30
        dias), da mais recente para a mais antiga, 20 por página.
      parameters:
        - name: Authorization
          in: header
          schema:
            type: string
            description: Token de autorização da conta principal, disponível no Portal Ombala
          example: Token a9eb6ea6-5777-4848-a9ed-8cbffc74a503
        - name: page
          in: query
          schema:
            type: integer
            description: Página, a começar em 0
          example: 0
        - name: status
          in: query
          schema:
            type: string
            enum:
              - PENDING
              - DELIVERED
              - FAILED
            description: Filtrar pelo estado da entrega
        - name: message_id
          in: query
          schema:
            type: string
            description: Filtrar pelo ID do destinatário
        - name: parent_id
          in: query
          schema:
            type: string
            description: Filtrar pelo ID da mensagem
      responses:
        "200":
          description: Lista de entregas
          content:
            application/json:
              schema:
                type: object
                properties:
                  deliveries:
                    type: array
                    items:
                      $ref: "#/components/schemas/CallbackDelivery"
                  pagination:
                    type: object
                    properties:
                      total_itens:
                        type: integer
                      page:
                        type: integer
                      items_per_page:
                        type: integer
                      last_page:
                        type: integer
        "400":
          description: |
            - `message_id inválido`
            - `parent_id inválido`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/callback/deliveries/{delivery_id}/retry:
    post:
      tags:
        - Callbacks
      summary: Reenviar Entrega
      description: |
        Volta a pôr na fila uma notificação `FAILED` (por exemplo, depois de o
        seu servidor ter estado em baixo mais tempo do que as novas tentativas
        automáticas). A notificação é reenviada com o mesmo `event_id` e
        volta a ter novas tentativas automáticas.
      parameters:
        - name: Authorization
          in: header
          schema:
            type: string
            description: Token de autorização da conta principal, disponível no Portal Ombala
          example: Token a9eb6ea6-5777-4848-a9ed-8cbffc74a503
        - name: delivery_id
          in: path
          required: true
          schema:
            type: string
            description: ID da entrega (o `id` devolvido em **Listar Entregas**)
          example: 5f0c6a1e-3b7d-4a49-9c55-2b8e4f0d7a11
      responses:
        "200":
          description: Entrega novamente na fila (`PENDING`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CallbackDelivery"
        "400":
          description: "`só é possível reenviar entregas falhadas`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Entrega inexistente (ou não pertence à conta autenticada)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/otp:
    post:
      tags:
        - OTP
      summary: Enviar Código OTP
      description: |
        Gera um código numérico aleatório e envia-o por SMS para o número
        indicado. A SMS é cobrada como qualquer outra (normalmente 1 crédito)
        e aparece na listagem de mensagens.

        O código **não é devolvido** na resposta: guarde o `id` (ou use o
        número de telefone) para o verificar depois com **Verificar Código
        OTP**.

        Regras:
        - Pedir um novo código para o mesmo número **no mesmo `context`**
          cancela o código anterior ainda pendente desse contexto (fica
          `CANCELLED`). Códigos pendentes de outros contextos não são
          afectados.
        - Use `context` quando tiver várias aplicações ou fluxos que podem
          pedir códigos para o mesmo número ao mesmo tempo (por exemplo
          `login` e `pagamento`, ou `app-android` e `site`), para que um não
          invalide o código do outro. Sem `context`, todos os códigos sem
          contexto partilham o mesmo "grupo".
        - Por omissão não há limite de reenvios. O servidor pode ser
          configurado com um intervalo mínimo entre envios e/ou um máximo de
          envios por hora para o mesmo número e contexto; nesse caso, acima
          do limite a resposta é `429`.
        - A SMS tem um `ttl` igual à validade do código: se não for aceite
          pelo operador antes de o código expirar, não chega a ser enviada e
          o crédito é devolvido.

        Pode autenticar com o token da conta principal ou com o `auth_token`
        de uma sub-conta; nesse caso o crédito é debitado da sub-conta (e da
        conta principal) e só essa sub-conta vê e verifica o código.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - to
                - from
              properties:
                to:
                  type: string
                  description: Número de telefone do destinatário, no formato 9XXXXXXXX.
                from:
                  type: string
                  description: Remetente da SMS, deve estar previamente criado e aprovado.
                context:
                  type: string
                  description: |
                    Contexto (aplicação ou fluxo) a que o código pertence, por
                    exemplo `login`, `pagamento` ou `app-android`. Livre, até
                    100 caracteres, não é obrigatório.

                    Um novo código só cancela os códigos pendentes do mesmo
                    número **e do mesmo contexto**. Na verificação por
                    `phone_number` tem de indicar o mesmo `context`.
                  maxLength: 100
                message:
                  type: string
                  description: |
                    Texto da SMS, não é obrigatório. Tem de conter o marcador
                    `CODIGO_OTP`, que é substituído pelo código gerado.

                    Por omissão: `O seu código de verificação é CODIGO_OTP.
                    Válido por N minuto(s).`
                length:
                  type: integer
                  description: Número de dígitos do código, não é obrigatório.
                  minimum: 4
                  maximum: 8
                  default: 6
                expires_in:
                  type: integer
                  description: Validade do código em segundos, não é obrigatório. Os
                    limites são configuráveis no servidor e podem variar.
                  minimum: 60
                  maximum: 3600
                  default: 300
                max_attempts:
                  type: integer
                  description: Número máximo de tentativas de verificação. Esgotadas as
                    tentativas, o código fica `BLOCKED` e é preciso pedir um
                    novo. Não é obrigatório.
                  minimum: 1
                  maximum: 10
                  default: 5
                reference:
                  type: string
                  description: Identificador livre do seu lado (por exemplo o id do utilizador ou da
                    transacção), devolvido nas respostas. Máximo 255
                    caracteres, não é obrigatório.
                  maxLength: 255
              example:
                to: "921939411"
                from: MINHALOJA
                context: login
                message: "MINHALOJA: o seu código é CODIGO_OTP. Não o partilhe."
                length: 6
                expires_in: 300
                max_attempts: 5
                reference: user-1234
      parameters:
        - name: Authorization
          in: header
          required: true
          schema:
            type: string
            description: Token de autorização disponível no Portal Ombala, ou
              `auth_token` de uma sub-conta
          example: Token a9eb6ea6-5777-4848-a9ed-8cbffc74a503
        - name: Content-Type
          in: header
          schema:
            type: string
            description: Formato do conteúdo do pedido, formato application/json,
              obrigatório.
          example: application/json
      responses:
        "201":
          description: Código gerado e SMS enviada/em envio
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OtpVerification"
        "429":
          description: |
            Só quando o servidor tem limites de reenvio configurados (por
            omissão não tem). Limite de envios para este número e contexto
            atingido, por exemplo:
            - `aguarde {n} segundo(s) antes de pedir um novo código para este número`
            - `limite de {n} códigos por hora para este número atingido; tente mais tarde`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        4XX:
          description: |
            Houve um problema no pedido, por exemplo:
            - `remetente inválido` / `remetente pendente de aprovação`
            - `número de telefone inválido, use o formato 9XXXXXXXX`
            - `a mensagem tem de conter o marcador CODIGO_OTP`
            - `length deve ser um número inteiro entre 4 e 8`
            - `expires_in deve ser um número inteiro de segundos entre {min} e {max}`
            - `max_attempts deve ser um número inteiro entre 1 e 10`
            - `sem créditos suficientes` / `subconta sem créditos suficientes`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/otp/verify:
    post:
      tags:
        - OTP
      summary: Verificar Código OTP
      description: |
        Confirma o código introduzido pelo utilizador. Indique o `id`
        devolvido por **Enviar Código OTP** ou, em alternativa, o
        `phone_number` e o `context` usados no envio (é usado o código
        pendente mais recente desse número nesse contexto; sem `context`,
        só são considerados códigos enviados sem contexto).

        Um código só pode ser verificado com sucesso **uma vez**. Cada
        verificação (certa ou errada) conta como uma tentativa.

        Para decidir se o utilizador pode avançar, use o campo `verified`
        (ou o código HTTP 200), nunca apenas a existência de resposta.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - code
              properties:
                id:
                  type: string
                  description: ID do código OTP. Obrigatório se não indicar `phone_number`.
                phone_number:
                  type: string
                  description: Número de telefone no formato 9XXXXXXXX. Usado quando não
                    se indica o `id`.
                context:
                  type: string
                  description: Contexto indicado no envio. Com `phone_number`, escolhe o
                    código desse contexto. Com `id`, se for indicado, tem de
                    coincidir com o contexto do código (senão a resposta é
                    `404`).
                code:
                  type: string
                  description: Código introduzido pelo utilizador.
              example:
                phone_number: "921939411"
                context: login
                code: "482913"
      parameters:
        - name: Authorization
          in: header
          required: true
          schema:
            type: string
            description: Token de autorização disponível no Portal Ombala, ou
              `auth_token` de uma sub-conta
          example: Token a9eb6ea6-5777-4848-a9ed-8cbffc74a503
        - name: Content-Type
          in: header
          schema:
            type: string
            description: Formato do conteúdo do pedido, formato application/json,
              obrigatório.
          example: application/json
      responses:
        "200":
          description: Código correcto. O código fica `VERIFIED` e não pode ser usado
            outra vez.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OtpVerificationResult"
              example:
                verified: true
                id: 0b6f3c1e-8d2a-4f5b-9c7e-1a2b3c4d5e6f
                phone_number: "921939411"
                context: login
                status: VERIFIED
                attempts_remaining: 0
                expires_at: "2026-09-30T10:05:00.000Z"
                verified_at: "2026-09-30T10:01:12.000Z"
                reference: user-1234
                message_id: 545b6ca5-a481-4abe-b3b9-ce1e8a4b3629
                created_at: "2026-09-30T10:00:00.000Z"
        "422":
          description: |
            Código não verificado. `status` e a mensagem de erro indicam a
            causa:
            - `código inválido` (`PENDING`, ainda com `attempts_remaining`)
            - `número máximo de tentativas atingido; peça um novo código` (`BLOCKED`)
            - `código expirado; peça um novo código` (`EXPIRED`)
            - `código já utilizado` (`VERIFIED`)
            - `código substituído por um pedido mais recente` (`CANCELLED`)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/OtpVerificationResult"
                  - $ref: "#/components/schemas/Error"
              example:
                verified: false
                id: 0b6f3c1e-8d2a-4f5b-9c7e-1a2b3c4d5e6f
                phone_number: "921939411"
                context: login
                status: PENDING
                attempts_remaining: 4
                expires_at: "2026-09-30T10:05:00.000Z"
                verified_at: null
                reference: user-1234
                message_id: 545b6ca5-a481-4abe-b3b9-ce1e8a4b3629
                created_at: "2026-09-30T10:00:00.000Z"
                errors:
                  - message: código inválido
        "404":
          description: |
            - `código inexistente` (o `id` não existe, não pertence à conta/sub-conta
              ou não corresponde ao `context` indicado)
            - `não existe nenhum código pendente para este número neste contexto`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "400":
          description: "`código obrigatório` / `indique o id ou o phone_number`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/otp/{otp_id}:
    get:
      tags:
        - OTP
      summary: Consultar Código OTP
      description: Consulta o estado de um código OTP (sem o próprio código).
      parameters:
        - name: Authorization
          in: header
          required: true
          schema:
            type: string
            description: Token de autorização disponível no Portal Ombala, ou
              `auth_token` de uma sub-conta
          example: Token a9eb6ea6-5777-4848-a9ed-8cbffc74a503
        - name: otp_id
          in: path
          required: true
          schema:
            type: string
          description: ID do código OTP
      responses:
        "200":
          description: Pedido Realizado com sucesso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OtpVerification"
        "404":
          description: "`código inexistente`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  schemas:
    Error:
      type: object
      properties:
        errors:
          type: array
          items:
            type: object
            properties:
              message:
                type: string
                example: sem créditos suficientes
    MessageStatus:
      type: string
      description: |
        Estado do envio, do ponto de vista do destinatário:
        - `PENDING`: ainda não foi enviada ao operador (inclui o período de
          espera até um eventual `schedule` ou `ttl`).
        - `SENT`: aceite pelo operador, a aguardar confirmação de entrega.
        - `DELIVERED`: confirmação de entrega recebida.
        - `REFUSED`: não foi entregue — inclui recusas/erros do operador e
          também SMS que expiraram por `ttl` sem chegarem a ser enviadas.
        - `CANCELLED`: cancelada antes de ser enviada (ver **Cancelar
          Mensagem Agendada**); o crédito foi devolvido.

        Para ser notificado sempre que este estado muda, configure um
        callback (ver secção **Callbacks**).
      enum:
        - PENDING
        - SENT
        - DELIVERED
        - REFUSED
        - CANCELLED
    Receiver:
      type: object
      properties:
        message_id:
          type: string
          description: ID deste destinatário (receiver)
        phone_number:
          type: string
        message_status:
          $ref: "#/components/schemas/MessageStatus"
    Message:
      type: object
      properties:
        id:
          type: string
        content:
          type: string
        cost:
          type: number
          description: Custo total da SMS (todas as partes e destinatários)
        schedule:
          type: string
          nullable: true
          description: Data/hora de agendamento, no formato yyyyMMddHHmmss, quando
            aplicável
        size:
          type: integer
          description: Número de caracteres da mensagem
        gsm:
          type: boolean
          description: Indica se a mensagem usa apenas caracteres do alfabeto GSM (false
            quando é necessária codificação UTF-16, por exemplo com emojis)
        parts:
          type: integer
          description: Número de partes/segmentos SMS em que a mensagem foi dividida
        from:
          type: string
          description: Nome do remetente
        created_at:
          type: string
          format: date-time
        total_recipients:
          oneOf:
            - type: integer
            - type: string
          description: Número de destinatários, ou uma mensagem informativa enquanto a
            lista de destinatários ainda está a ser construída em segundo
            plano (envios em massa)
        recipients_pending:
          type: integer
        recipients_delivered:
          type: integer
        recipients_refused:
          type: integer
        recipients_cancelled:
          type: integer
          description: Destinatários cancelados antes do envio
        cancelled_at:
          type: string
          format: date-time
          nullable: true
          description: Momento em que a mensagem agendada foi cancelada, quando
            aplicável
        recipients:
          oneOf:
            - type: array
              items:
                $ref: "#/components/schemas/Receiver"
            - type: string
          description: Lista de destinatários, ou uma mensagem informativa enquanto a
            lista ainda está a ser construída em segundo plano (envios em
            massa)
    Pagination:
      type: object
      properties:
        total_itens:
          type: integer
        page:
          type: integer
        items_per_page:
          type: integer
        last_page:
          type: integer
    MessageList:
      type: object
      properties:
        messages:
          type: array
          items:
            $ref: "#/components/schemas/Message"
        pagination:
          $ref: "#/components/schemas/Pagination"
    Number:
      type: object
      properties:
        id:
          type: string
        phone_number:
          type: string
        name:
          type: string
    SendingGroup:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        created_at:
          type: string
          format: date-time
        members:
          type: array
          items:
            $ref: "#/components/schemas/Number"
    SubAccount:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        available_sms:
          type: integer
        auth_token:
          type: string
          description: Token a usar como Authorization ao enviar SMS em nome desta
            sub-conta
    OtpStatus:
      type: string
      description: |
        Estado do código OTP:
        - `PENDING`: enviado, à espera de verificação.
        - `VERIFIED`: verificado com sucesso (não pode ser usado outra vez).
        - `EXPIRED`: a validade (`expires_in`) terminou sem verificação.
        - `BLOCKED`: esgotou as tentativas (`max_attempts`).
        - `CANCELLED`: substituído por um novo código pedido para o mesmo número
          e o mesmo `context`.
      enum:
        - PENDING
        - VERIFIED
        - EXPIRED
        - BLOCKED
        - CANCELLED
    OtpVerification:
      type: object
      properties:
        id:
          type: string
          description: ID do código OTP, a usar em Verificar/Consultar
        phone_number:
          type: string
        context:
          type: string
          nullable: true
          description: O `context` indicado no envio
        status:
          $ref: "#/components/schemas/OtpStatus"
        attempts_remaining:
          type: integer
          description: Tentativas de verificação que ainda restam (0 se o código já
            não estiver `PENDING`)
        expires_at:
          type: string
          format: date-time
        verified_at:
          type: string
          format: date-time
          nullable: true
        reference:
          type: string
          nullable: true
          description: O `reference` indicado no envio
        message_id:
          type: string
          description: ID da mensagem (SMS) enviada com o código
        created_at:
          type: string
          format: date-time
    OtpVerificationResult:
      allOf:
        - type: object
          properties:
            verified:
              type: boolean
              description: true apenas quando o código foi aceite neste pedido
        - $ref: "#/components/schemas/OtpVerification"
    CallbackConfig:
      type: object
      properties:
        url:
          type: string
          nullable: true
          description: URL do callback da conta, ou `null` se não estiver configurado
        include_sent:
          type: boolean
          description: Se o estado `SENT` também é notificado
        secret:
          type: string
          nullable: true
          description: Segredo usado para assinar as notificações (ver **Verificar a
            assinatura**)
      example:
        url: https://www.minhaloja.ao/ombala/callback
        include_sent: true
        secret: whsec_6f1d0c9a8b7e6d5c4b3a29180f7e6d5c4b3a2918
    StatusCallbackEvent:
      type: object
      description: Corpo enviado ao callback em cada mudança de estado
      properties:
        event_id:
          type: string
          description: ID único da notificação, para ignorar repetições
        event:
          type: string
          enum:
            - message.status
            - test
        message_id:
          type: string
          description: ID do destinatário
        parent_id:
          type: string
          description: ID da mensagem
        phone_number:
          type: string
        status:
          type: string
          enum:
            - SENT
            - DELIVERED
            - REFUSED
            - CANCELLED
        error_code:
          type: string
          nullable: true
          description: Código de erro do operador, quando existir
        sub_account_id:
          type: string
          nullable: true
        occurred_at:
          type: string
          format: date-time
    CallbackDelivery:
      type: object
      properties:
        id:
          type: string
          description: ID da entrega (igual ao `event_id` enviado)
        event:
          type: string
          enum:
            - message.status
            - test
        url:
          type: string
          description: URL para onde a notificação foi enviada
        status:
          type: string
          description: |
            - `PENDING`: por entregar ou a aguardar uma nova tentativa
            - `DELIVERED`: o seu servidor respondeu `2xx`
            - `FAILED`: tentativas esgotadas (pode ser reenviada)
          enum:
            - PENDING
            - DELIVERED
            - FAILED
        attempts:
          type: integer
          description: Número de tentativas feitas
        response_code:
          type: integer
          nullable: true
          description: Código HTTP da última resposta do seu servidor
        response_body:
          type: string
          nullable: true
          description: Início (até 1000 caracteres) da última resposta do seu servidor
        error:
          type: string
          nullable: true
          description: Motivo da última falha (ex. `resposta HTTP 500`, timeout)
        payload:
          $ref: "#/components/schemas/StatusCallbackEvent"
        last_attempt_at:
          type: string
          format: date-time
          nullable: true
        delivered_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
